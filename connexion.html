<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Connexion - ÉcoVie</title>

    <link
        rel="stylesheet"
        href="connexion.css"
    >

</head>


<body>


<div class="login-container">


    <div class="login-box">


        <a href="index.html" class="logo">
            ÉcoVie
        </a>


        <h1>
            Bienvenue
        </h1>


        <p class="subtitle">
            Connectez-vous à votre espace membre
        </p>


        <form action="connexion.php" method="POST">


            <div class="form-group">

                <label for="email">
                    Adresse email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="exemple@email.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Mot de passe
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Votre mot de passe"
                    required
                >

            </div>


            <button type="submit">
                Se connecter
            </button>


        </form>


        <p class="register">

            Vous n'avez pas encore de compte ?

            <a href="ins.html">
                Créer un compte
            </a>

        </p>


        <a href="accueil.html" class="back">
            ← Retour à l'accueil
        </a>


    </div>

</div>


</body>

</html>
